<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lady Rabi'a Academy — Complete Your Profile</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ivory: #f9f5ed;
    --ivory-warm: #f0ebe0;
    --ink: #1c1a14;
    --green: #1B3C28;
    --green-deep: #142e1f;
    --gold: #b5860d;
    --gold-light: #c9a84c;
    --muted: #5a5240;
  }

  html { scroll-behavior: smooth; }
  html, body { width: 100%; overflow-x: hidden; }

  body {
    background: var(--ivory);
    font-family: 'EB Garamond', Georgia, serif;
    color: var(--ink);
    line-height: 1;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }

  ::selection { background: rgba(181,134,13,.25); }

  /* ══ PROFILE SCENE ══ */
  .profile-scene {
    flex: 1;
    min-height: 100vh;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    background: var(--ivory-warm);
    padding: 5rem 1.5rem;
  }

  .profile-panel {
    position: relative; width: 100%; max-width: 480px;
    background: var(--ivory);
    border: 0.5px solid var(--gold-light);
    border-radius: 1px;
    padding: 2.6rem 2.3rem 2.4rem;
    box-shadow: 0 40px 80px -30px rgba(20,46,31,.25);
  }

  .profile-panel .c {
    position: absolute; width: 14px; height: 14px; border-color: var(--gold);
  }
  .profile-panel .c.tl { top: 5px; left: 5px; border-top: 1px solid; border-left: 1px solid; }
  .profile-panel .c.tr { top: 5px; right: 5px; border-top: 1px solid; border-right: 1px solid; }
  .profile-panel .c.bl { bottom: 5px; left: 5px; border-bottom: 1px solid; border-left: 1px solid; }
  .profile-panel .c.br { bottom: 5px; right: 5px; border-bottom: 1px solid; border-right: 1px solid; }

  .profile-header {
    text-align: center;
    margin-bottom: 1.6rem;
  }

  .section-lbl {
    display: block;
    font-size: 10.5px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: .7rem;
  }

  .profile-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 400;
    font-style: italic;
    color: var(--green);
    line-height: 1.35;
    margin-bottom: 0.5rem;
  }

  .profile-desc {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
  }

  .profile-orn {
    display: flex;
    justify-content: center;
    margin-top: .9rem;
  }

  .profile-orn svg {
    width: 120px;
    height: auto;
  }

  .profile-orn path {
    stroke: var(--gold);
    fill: none;
  }

  .profile-form {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .form-fields {
    border: none;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
    margin-bottom: 1.5rem;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .field label {
    font-size: 10.5px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .field input {
    border: 0.5px solid rgba(201,168,76,.6);
    padding: 13px 14px;
    font-family: 'EB Garamond', serif;
    font-size: 15px;
    background: var(--ivory);
    color: var(--ink);
    border-radius: 1px;
    outline: none;
    transition: border-color .3s;
    width: 100%;
  }

  .field input:focus {
    border-color: var(--gold);
  }

  .field input:disabled {
    background: var(--ivory-warm);
    color: var(--muted);
  }

  .btn-primary {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--green);
    color: var(--ivory);
    font-family: 'EB Garamond', serif;
    font-size: 15px;
    letter-spacing: .08em;
    padding: 15px 36px;
    border: none;
    cursor: pointer;
    border-radius: 1px;
    position: relative;
    overflow: hidden;
    transition: transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px -12px rgba(27,60,40,.55);
  }

  .btn-primary span {
    position: relative;
    z-index: 1;
  }

  .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .error-message {
    background: rgba(169,68,66,.1);
    border: 1px solid rgba(169,68,66,.3);
    color: #a94442;
    padding: 12px 14px;
    border-radius: 1px;
    font-size: 14px;
    margin-bottom: 1rem;
    display: none;
  }

  .status-message {
    display: none;
    text-align: center;
    padding: 2rem 0;
  }
  .status-message.show { display: block; }
  .status-message .spinner {
    width: 32px; height: 32px; margin: 0 auto 1.1rem;
    border: 2px solid rgba(201,168,76,.25); border-top-color: var(--green);
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-message p { font-size: 14.5px; color: var(--muted); font-style: italic; }

  .error-message.show {
    display: block;
  }
</style>
</head>
<body>

<section class="profile-scene">
  <div class="profile-panel">
    <div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>
    
    <header class="profile-header">
      <span class="section-lbl">Lady Rabi'a Academy</span>
      <h1 class="profile-title">Complete Your Profile</h1>
      <p class="profile-desc">We need a few more details to set up your account.</p>
      <div class="profile-orn" aria-hidden="true">
        <svg viewBox="0 0 120 12">
          <path stroke-width="0.6" d="M 0 6 H 46"/>
          <path stroke-width="0.6" d="M 120 6 H 74"/>
          <path stroke-width="0.7" d="M 60 0.5 L 65.5 6 L 60 11.5 L 54.5 6 Z"/>
        </svg>
      </div>
    </header>

    <div id="errorMessage" class="error-message"></div>
    <div id="statusMessage" class="status-message">
      <div class="spinner"></div>
      <p id="statusText">Confirming your payment…</p>
    </div>

    <form class="profile-form" id="profileForm">
      <fieldset class="form-fields">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" disabled>
        </div>
        <div class="field">
          <label for="name">Name *</label>
          <input id="name" name="name" type="text" required autocomplete="given-name">
        </div>
        <div class="field">
          <label for="surname">Surname *</label>
          <input id="surname" name="surname" type="text" required autocomplete="family-name">
        </div>
        <div class="field">
          <label for="contactNumber">Contact Number *</label>
          <input id="contactNumber" name="contactNumber" type="tel" required autocomplete="tel">
        </div>
      </fieldset>
      <button class="btn-primary" type="submit" id="submitBtn">
        <span>Complete Profile</span>
      </button>
    </form>
  </div>
</section>

<script>
  var o_options = {
    domain: 'lady-rabia-academy.outseta.com',
    load: 'auth,profile',
    auth: {
      authenticationCallbackUrl: window.location.href
    }
  };
</script>
<script src="https://cdn.outseta.com/outseta.min.js" data-options="o_options"></script>
<script src="outseta-client.js?v=1"></script>

<script>
(function() {
  var form = document.getElementById('profileForm');
  var submitBtn = document.getElementById('submitBtn');
  var errorMsg = document.getElementById('errorMessage');
  var statusMsg = document.getElementById('statusMessage');
  var statusText = document.getElementById('statusText');
  var outsetaUser = null;

  function showError(message) {
    errorMsg.textContent = message;
    errorMsg.classList.add('show');
  }

  function hideError() {
    errorMsg.classList.remove('show');
  }

  async function hasAccess() {
    try {
      await window.LRAAuth.callGateway('get-available-content');
      return true;
    } catch (e) {
      return false;
    }
  }

  // Load current user data
  async function loadUserData() {
    try {
      var signedIn = await window.LRAAuth.signedIn();
      if (!signedIn) {
        window.location.href = 'index.html';
        return;
      }
      outsetaUser = await window.LRAAuth.getUser();
      try {
        var fullProfile = await window.LRAAuth.getProfile();
        outsetaUser = Object.assign({}, outsetaUser, fullProfile);
      } catch (e) {
        console.error('Failed to load full profile (continuing with JWT claims only):', e);
      }

      // Payment comes before profile completion: everyone must have a
      // subscription with access before this page will even show the form.
      var params = new URLSearchParams(window.location.search);
      if (params.get('checkout') === 'success') {
        // Landed here right after Outseta's checkout widget closes — the
        // webhook that activates the subscription may take a moment. Poll
        // briefly instead of either showing the form prematurely or
        // bouncing back to the paywall a member who already paid.
        form.style.display = 'none';
        statusMsg.classList.add('show');
        var confirmed = false;
        for (var attempt = 0; attempt < 8 && !confirmed; attempt++) {
          confirmed = await hasAccess();
          if (!confirmed) await new Promise(function (resolve) { setTimeout(resolve, 1500); });
        }
        statusMsg.classList.remove('show');
        form.style.display = '';
        if (!confirmed) {
          statusText.textContent = 'Still confirming your payment…';
          statusMsg.classList.add('show');
          form.style.display = 'none';
          showError('Still confirming your payment — if you already paid, this can take a minute. Refresh this page, or contact us if it persists.');
          return;
        }
      } else if (!(await hasAccess())) {
        window.location.href = 'subscribe.html';
        return;
      }

      // Populate fields — Outseta's own registration form already collects
      // name and email, so this page's only real job is contact number.
      document.getElementById('email').value = outsetaUser.Email || '';
      if (outsetaUser.FirstName) document.getElementById('name').value = outsetaUser.FirstName;
      if (outsetaUser.LastName) document.getElementById('surname').value = outsetaUser.LastName;
      if (outsetaUser.PhoneMobile) document.getElementById('contactNumber').value = outsetaUser.PhoneMobile;

      // Profile already complete — pass straight through to the dashboard.
      if (outsetaUser.FirstName && outsetaUser.LastName && outsetaUser.PhoneMobile) {
        window.location.href = '3-membership-v2-dashboard.html';
      }
    } catch (error) {
      console.error('Failed to load user data:', error);
      showError('Failed to load user data. Please try again.');
    }
  }

  // Handle form submission
  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    hideError();

    var name = document.getElementById('name').value.trim();
    var surname = document.getElementById('surname').value.trim();
    var contactNumber = document.getElementById('contactNumber').value.trim();

    if (!name || !surname || !contactNumber) {
      showError('Please fill in all required fields.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.querySelector('span').textContent = 'Saving...';

    try {
      if (!outsetaUser) {
        showError('Session expired. Please log in again.');
        setTimeout(function() {
          window.location.href = 'index.html';
        }, 2000);
        return;
      }

      await window.LRAAuth.updateProfile({
        FirstName: name,
        LastName: surname,
        PhoneMobile: contactNumber
      });

      window.location.href = '3-membership-v2-dashboard.html';

    } catch (error) {
      console.error('Profile update error:', error);
      showError('An unexpected error occurred. Please try again.');
      submitBtn.disabled = false;
      submitBtn.querySelector('span').textContent = 'Complete Profile';
    }
  });

  // Load user data on page load
  loadUserData();
})();
</script>

</body>
</html>
