<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lady Rabi'a Academy — Join the Membership</title>
<meta name="description" content="Join the Lady Rabi'a Academy membership.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="Lady Rabi'a Academy — Join the Membership">
<meta property="og:description" content="Join the Lady Rabi'a Academy membership.">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ivory: #f9f5ed;
    --ivory-warm: #f0ebe0;
    --ink: #1c1a14;
    --green: #1B3C28;
    --green-deep: #142e1f;
    --gold: #b5860d;
    --gold-light: #c9a84c;
    --muted: #5a5240;
  }

  html { scroll-behavior: smooth; }
  html, body { width: 100%; overflow-x: hidden; }

  body {
    background: var(--ivory);
    font-family: 'EB Garamond', Georgia, serif;
    color: var(--ink);
    line-height: 1;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }

  ::selection { background: rgba(181,134,13,.25); }

  a { color: var(--gold); }
  a:hover { color: var(--green); }

  /* ══ NAV ══ */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    border-bottom: 0.5px solid rgba(201,168,76,.45);
    background: rgba(249,245,237,.94);
    backdrop-filter: blur(12px);
    box-shadow: 0 1px 0 rgba(201,168,76,.15);
    transition: box-shadow .3s ease;
  }
  .nav.scrolled {
    box-shadow: 0 10px 30px -18px rgba(27,60,40,.35);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1.2rem 2rem; flex-wrap: wrap;
    max-width: 1240px; margin: 0 auto;
    padding: 1.5rem clamp(1.5rem, 5vw, 2.75rem);
  }
  .nav-logo {
    font-size: 18px; font-family: 'Playfair Display', serif; font-style: italic;
    letter-spacing: .01em;
    color: var(--green); text-decoration: none; display: flex; align-items: center; gap: 12px;
  }
  .nav-logo svg { display: block; width: 22px; height: 22px; }
  .nav-links { display: flex; align-items: center; gap: 2.2rem; }
  .nav-link {
    font-size: 16px; color: var(--muted); text-decoration: none;
    position: relative; padding-bottom: 4px; transition: color .3s;
    background: none; border: none; cursor: pointer; font-family: 'EB Garamond', serif;
  }
  .nav-link::after {
    content: ''; position: absolute; left: 0; bottom: 0; height: 0.5px; width: 100%;
    background: var(--gold); transform: scaleX(0); transform-origin: right;
    transition: transform .45s cubic-bezier(.22,1,.36,1);
  }
  .nav-link:hover { color: var(--green); }
  .nav-link:hover::after { transform: scaleX(1); transform-origin: left; }
  .nav-link.active { color: var(--green); font-style: italic; }
  .nav-link.active::after { transform: scaleX(1); }

  /* Mobile hamburger */
  .nav-toggle { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 8px; }
  .nav-toggle span { display: block; width: 22px; height: 2px; background: var(--green); transition: transform .3s, opacity .3s; }

  @media (max-width: 900px) {
    .nav-toggle { display: flex; }
    .nav-links {
      display: none; position: absolute; top: 100%; left: 0; right: 0;
      flex-direction: column; align-items: flex-start; gap: 1.2rem;
      background: rgba(249,245,237,.98); border-bottom: 0.5px solid rgba(201,168,76,.45);
      padding: 1rem clamp(1.5rem, 5vw, 2.75rem) 1.5rem;
      box-shadow: 0 10px 30px -18px rgba(27,60,40,.35);
    }
    .nav.open .nav-links { display: flex; }
    .nav.open .nav-toggle span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav.open .nav-toggle span:nth-child(2) { opacity: 0; }
    .nav.open .nav-toggle span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
  }

  /* ══ SIGNUP SCENE ══ */
  .signup {
    flex: 1;
    min-height: 100vh;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    background: var(--ivory-warm);
    padding: 8.5rem 1.5rem 5rem;
  }

  .signup-panel {
    position: relative; width: 100%; max-width: 640px;
    background: var(--ivory);
    border: 0.5px solid var(--gold-light);
    border-radius: 1px;
    padding: 2.6rem 2.3rem 2.4rem;
    box-shadow: 0 40px 80px -30px rgba(20,46,31,.25);
  }

  .signup-panel .c {
    position: absolute; width: 14px; height: 14px; border-color: var(--gold);
  }
  .signup-panel .c.tl { top: 5px; left: 5px; border-top: 1px solid; border-left: 1px solid; }
  .signup-panel .c.tr { top: 5px; right: 5px; border-top: 1px solid; border-right: 1px solid; }
  .signup-panel .c.bl { bottom: 5px; left: 5px; border-bottom: 1px solid; border-left: 1px solid; }
  .signup-panel .c.br { bottom: 5px; right: 5px; border-bottom: 1px solid; border-right: 1px solid; }

  .signup-header {
    text-align: center;
    margin-bottom: 1.6rem;
  }

  .section-lbl {
    display: block;
    font-size: 10.5px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: .7rem;
  }

  .signup-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 400;
    font-style: italic;
    color: var(--green);
    line-height: 1.35;
  }

  .signup-orn {
    display: flex;
    justify-content: center;
    margin-top: .9rem;
  }

  .signup-orn svg {
    width: 120px;
    height: auto;
  }

  .signup-orn path {
    stroke: var(--gold);
    fill: none;
  }

  .plans {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    margin-top: 1.6rem;
  }
  .plan-card {
    position: relative;
    border: 0.5px solid var(--gold-light);
    border-radius: 1px;
    padding: 1.6rem 1.3rem;
    text-align: center;
  }
  .plan-card.is-recommended { border-color: var(--gold); }
  .plan-badge {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    background: var(--green); color: var(--ivory);
    font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase;
    padding: 4px 12px; white-space: nowrap;
  }
  .plan-name {
    font-family: 'Playfair Display', serif; font-size: 17px; font-style: italic;
    color: var(--green); margin-bottom: .6rem;
  }
  .plan-price {
    font-family: 'Playfair Display', serif; font-size: 34px;
    color: var(--green); line-height: 1; margin-bottom: 4px;
  }
  .plan-price .cur { font-size: 17px; vertical-align: top; }
  .plan-period { font-size: 12px; color: var(--muted); font-style: italic; margin-bottom: 1rem; }

  .btn-primary {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--green);
    color: var(--ivory);
    font-family: 'EB Garamond', serif;
    font-size: 14px;
    letter-spacing: .06em;
    padding: 13px 20px;
    border: none;
    cursor: pointer;
    border-radius: 1px;
    text-decoration: none;
    position: relative;
    overflow: hidden;
    transition: transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px -12px rgba(27,60,40,.55);
  }

  .btn-primary span {
    position: relative;
    z-index: 1;
  }

  .signup-alt {
    text-align: center;
    margin-top: 1.6rem;
    font-size: 13px;
    font-style: italic;
    color: var(--muted);
  }

  .signup-alt button {
    background: none; border: none; padding: 0; cursor: pointer;
    color: var(--gold);
    font-family: inherit; font-size: inherit; font-style: italic;
    text-decoration: none;
    border-bottom: 0.5px solid rgba(201,168,76,.5);
    transition: color .3s, border-color .3s;
  }

  .signup-alt button:hover {
    color: var(--green);
    border-color: var(--gold);
  }
</style>
</head>
<body>

<!-- ══ NAV ══ -->
<nav class="nav" id="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="index.html">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><polygon points="8,0.8 15.2,8 8,15.2 0.8,8" fill="none" stroke="#b5860d" stroke-width="0.8"/><polygon points="8,4.6 11.4,8 8,11.4 4.6,8" fill="#b5860d"/></svg>
      <span>Lady Rabi'a Academy</span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="4-about-razia.html">About Razia</a>
      <a class="nav-link" href="3-membership.html">The Membership</a>
      <a class="nav-link" href="2-opening-teaching.html">The Opening Teaching</a>
      <button class="nav-link" type="button" data-auth-toggle onclick="Outseta.auth.open({widgetMode:'login', mode:'popup'})">Log in</button>
    </div>
  </div>
</nav>

<!-- ══ SIGNUP SCENE — plan picker; Outseta's registration widget handles
     account creation + payment natively once a plan is chosen ══ -->
<section class="signup">
  <div class="signup-panel">
    <div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>

    <header class="signup-header">
      <span class="section-lbl">Lady Rabi'a Academy</span>
      <h1 class="signup-title">Join the Membership</h1>
      <div class="signup-orn" aria-hidden="true">
        <svg viewBox="0 0 120 12">
          <path stroke-width="0.6" d="M 0 6 H 46"/>
          <path stroke-width="0.6" d="M 120 6 H 74"/>
          <path stroke-width="0.7" d="M 60 0.5 L 65.5 6 L 60 11.5 L 54.5 6 Z"/>
        </svg>
      </div>
    </header>

    <div class="plans">
      <div class="plan-card is-recommended">
        <span class="plan-badge">First 30 seats</span>
        <div class="plan-name">Founding member</div>
        <div class="plan-price"><span class="cur">£</span>17</div>
        <div class="plan-period">a month, renewed by choice</div>
        <button class="btn-primary" type="button" data-plan-uid="wQXNqoWK"><span>Choose Founding</span></button>
      </div>
      <div class="plan-card">
        <div class="plan-name">Standard</div>
        <div class="plan-price"><span class="cur">£</span>25</div>
        <div class="plan-period">a month, renewed by choice</div>
        <button class="btn-primary" type="button" data-plan-uid="XQYa47QP"><span>Choose Standard</span></button>
      </div>
    </div>

    <p class="signup-alt">
      Already have an account? <button type="button" onclick="Outseta.auth.open({widgetMode:'login', mode:'popup'})">Log in</button>
    </p>
  </div>
</section>

<script>
(function () {
  var nav = document.getElementById('nav');
  var toggle = document.getElementById('navToggle');
  if (!nav || !toggle) return;
  toggle.addEventListener('click', function () {
    var open = nav.classList.toggle('open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  });
  function onScroll() { nav.classList.toggle('scrolled', window.scrollY > 40); }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>

<script>
  var o_options = {
    domain: 'lady-rabia-academy.outseta.com',
    load: 'auth,profile'
  };
</script>
<script src="https://cdn.outseta.com/outseta.min.js" data-options="o_options"></script>
<script src="outseta-client.js?v=1"></script>

<script>
(function () {
  'use strict';
  document.querySelectorAll('.plan-card [data-plan-uid]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (!window.Outseta) return;
      window.Outseta.auth.open({
        widgetMode: 'register',
        mode: 'popup',
        planUid: btn.dataset.planUid
      });
    });
  });
  // After successful registration + checkout, the widget fires this event
  // — take the new member straight to the payment-first flow gate.
  window.Outseta && window.Outseta.on('accessToken.set', function () {
    window.location.href = 'complete-profile.html';
  });
})();
</script>

</body>
</html>
